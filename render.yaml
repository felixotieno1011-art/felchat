services:
  - type: web
    name: felchat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: felchat-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: felchat-redis
          property: connectionString

  - type: redis
    name: felchat-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: felchat-db
    databaseName: felchat
    plan: free
    postgresMajorVersion: "16"
