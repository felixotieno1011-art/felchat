<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FelChat — AI Security Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<!-- Syntax highlighting -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root {
    --gold: #D4AF37; --gold-deep: #B8860B; --gold-light: #F5E6A8; --gold-pale: #FBF3D5;
    --ink: #2A1F0A; --ink-soft: #5C4A1F;
    --green: #2E8B57; --green-light: #3FAE7A; --blue: #1E6FD9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .hidden { display: none !important; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #FBF3D5 0%, transparent 50%), radial-gradient(circle at 80% 80%, #E8C766 0%, transparent 55%), linear-gradient(135deg, #F5E6A8 0%, #E8C766 40%, #D4AF37 75%, #B8860B 100%);
    font-family: 'Inter', sans-serif; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden;
  }
  
  /* Auth Card (unchanged) */
  .card { position: relative; z-index: 2; width: 100%; max-width: 420px; background: linear-gradient(160deg, #FBF3D5 0%, #F5E6A8 55%, #E8C766 100%); border: 1px solid rgba(184,134,11,0.45); border-radius: 24px; padding: 48px 40px 40px; box-shadow: 0 30px 70px rgba(90,60,0,0.35); }
  .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 36px; }
  .logo { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #FFFFFF 0%, #FBF3D5 70%, #F5E6A8 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #D4AF37, 0 0 0 5px #B8860B; }
  .logo svg { width: 62px; height: 62px; }
  .brand { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; margin-top: 20px; color: var(--ink); }
  .tagline { font-size: 12px; color: var(--ink-soft); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .field input { width: 100%; background: rgba(255,255,255,0.65); border: 1.5px solid rgba(184,134,11,0.4); border-radius: 12px; padding: 14px 16px; color: var(--ink); outline: none; }
  .btn-group { display: flex; gap: 12px; margin-top: 20px; }
  .btn { flex: 1; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg, #3FAE7A 0%, #2E8B57 40%, #1E6FD9 100%); color: white; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--ink); border: 2px solid var(--gold-deep); }
  .error { color: #d93025; font-weight: 600; font-size: 13px; text-align: center; margin-top: 15px; }

  /* Chat Screen */
  .chat-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--gold-pale); display: flex; flex-direction: column; z-index: 10; }
  .chat-header { padding: 15px 20px; background: linear-gradient(135deg, #FBF3D5 0%, #F5E6A8 100%); border-bottom: 2px solid var(--gold-deep); display: flex; justify-content: space-between; align-items: center; }
  .chat-header h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--ink); }
  .header-actions { display: flex; gap: 10px; }
  .header-actions button { background: transparent; border: 2px solid var(--gold-deep); padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; color: var(--ink); }
  
  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #fffaf0; }
  
  /* NEW: Suggested Prompts */
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .suggestion-chip { background: white; border: 1.5px solid var(--gold); color: var(--ink); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; font-weight: 500; }
  .suggestion-chip:hover { background: var(--gold-light); transform: translateY(-1px); }

  /* NEW: Messages with Avatars */
  .message-row { display: flex; gap: 10px; max-width: 90%; }
  .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
  .avatar.assistant { background: linear-gradient(135deg, #D4AF37, #B8860B); color: white; }
  .avatar.user { background: linear-gradient(135deg, #3FAE7A, #1E6FD9); color: white; }
  .message { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); word-wrap: break-word; }
  .message.assistant { background: #ffffff; border: 1px solid var(--gold-light); color: var(--ink); border-top-left-radius: 4px; }
  .message.user { background: linear-gradient(135deg, #3FAE7A 0%, #1E6FD9 100%); color: #fff; border-top-right-radius: 4px; }

  /* NEW: Typing Indicator */
  .typing-indicator { display: flex; gap: 4px; padding: 8px 4px; }
  .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-soft); animation: bounce 1.4s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* NEW: Code block copy button */
  pre { position: relative; }
  .copy-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }

  .chat-footer { padding: 15px 20px; background: #ffffff; border-top: 2px solid var(--gold-light); display: flex; gap: 10px; align-items: center; }
  .chat-footer input { flex: 1; padding: 12px 18px; border: 2px solid var(--gold-light); border-radius: 30px; font-size: 16px; outline: none; background: #fffaf0; height: 48px; }
  .chat-footer button { height: 48px; padding: 0 24px; background: linear-gradient(135deg, #3FAE7A 0%, #1E6FD9 100%); color: white; border: none; border-radius: 30px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <!-- AUTH CARD (unchanged) -->
  <div class="card" id="auth-container">
    <div class="logo-wrap">
      <div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M14 10h36a6 6 0 0 1 6 6v24a6 6 0 0 1-6 6H32l-8 8v-8h-10a6 6 0 0 1-6-6V16a6 6 0 0 1 6-6z" fill="url(#bubbleFill)" stroke="url(#gbGrad)" stroke-width="2.5"/><path d="M24 22h18M24 30h13M24 38h9" stroke="#F5E6A8" stroke-width="4.5" stroke-linecap="round"/></svg></div>
      <div class="brand">FelChat</div>
      <div class="tagline">Conversations, Refined</div>
    </div>
    <form id="auth-form">
      <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required /></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required /></div>
      <div class="btn-group">
        <button type="button" id="btn-login" class="btn">Sign In</button>
        <button type="button" id="btn-register" class="btn secondary">Register</button>
      </div>
      <p id="auth-error" class="error"></p>
    </form>
  </div>

  <!-- CHAT SCREEN -->
  <div class="chat-container hidden" id="chat-container">
    <div class="chat-header">
      <h2>FelChat</h2>
      <div class="header-actions">
        <button id="btn-upload">📄 Upload Log</button>
        <button id="btn-logout">Logout</button>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages">
      <!-- Suggested Prompts -->
      <div class="suggestions">
        <div class="suggestion-chip" onclick="document.getElementById('chat-input').value='Explain Log4Shell'; document.getElementById('btn-send').click();">Explain Log4Shell</div>
        <div class="suggestion-chip" onclick="document.getElementById('chat-input').value='What projects has Felix built?'; document.getElementById('btn-send').click();">Felix's Portfolio</div>
        <div class="suggestion-chip" onclick="document.getElementById('chat-input').value='What is a SIEM?'; document.getElementById('btn-send').click();">What is a SIEM?</div>
      </div>
    </div>
    <div class="chat-footer">
      <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
      <button id="btn-send">Send</button>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
