<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FelChat — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4AF37;
    --gold-deep: #B8860B;
    --gold-light: #F5E6A8;
    --gold-pale: #FBF3D5;
    --ink: #2A1F0A;
    --ink-soft: #5C4A1F;
    --green: #2E8B57;
    --green-light: #3FAE7A;
    --blue: #1E6FD9;
    --blue-light: #4A90E2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  .hidden { display: none !important; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, #FBF3D5 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #E8C766 0%, transparent 55%),
      linear-gradient(135deg, #F5E6A8 0%, #E8C766 40%, #D4AF37 75%, #B8860B 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%);
    top: -180px; left: -120px;
    filter: blur(30px);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(184,134,11,0.35) 0%, transparent 70%);
    bottom: -160px; right: -100px;
    filter: blur(30px);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, #FBF3D5 0%, #F5E6A8 55%, #E8C766 100%);
    border: 1px solid rgba(184,134,11,0.45);
    border-radius: 24px;
    padding: 48px 40px 40px;
    box-shadow: 0 30px 70px rgba(90,60,0,0.35), 0 0 0 1px rgba(255,255,255,0.5) inset, 0 10px 30px rgba(184,134,11,0.3);
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 36px; }
  .logo {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #FFFFFF 0%, #FBF3D5 70%, #F5E6A8 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px #D4AF37, 0 0 0 5px #B8860B, 0 0 0 7px rgba(255,255,255,0.4), 0 12px 30px rgba(90,60,0,0.35);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 3px #D4AF37, 0 0 0 5px #B8860B, 0 0 0 7px rgba(255,255,255,0.4), 0 12px 30px rgba(90,60,0,0.35); }
    50%      { box-shadow: 0 0 0 3px #F5E6A8, 0 0 0 6px #D4AF37, 0 0 0 9px rgba(255,255,255,0.5), 0 12px 40px rgba(30,111,217,0.25); }
  }
  .logo svg { width: 62px; height: 62px; }
  .brand { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; margin-top: 20px; color: var(--ink); letter-spacing: 0.5px; text-shadow: 0 1px 0 rgba(255,255,255,0.6); }
  .tagline { font-size: 12px; color: var(--ink-soft); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; font-weight: 500; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); margin-bottom: 8px; font-weight: 600; }
  .field input { width: 100%; background: rgba(255,255,255,0.65); border: 1.5px solid rgba(184,134,11,0.4); border-radius: 12px; padding: 14px 16px; color: var(--ink); font-family: 'Inter', sans-serif; font-size: 15px; transition: all 0.3s ease; outline: none; }
  .field input::placeholder { color: #A08A55; }
  .field input:focus { border-color: var(--blue); background: #ffffff; box-shadow: 0 0 0 4px rgba(30,111,217,0.15), 0 6px 18px rgba(30,111,217,0.15); }

  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; font-size: 13px; }
  .remember { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); cursor: pointer; user-select: none; font-weight: 500; }
  .remember input { appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--gold-deep); border-radius: 4px; cursor: pointer; position: relative; transition: all 0.2s; background: rgba(255,255,255,0.6); }
  .remember input:checked { background: var(--green); border-color: var(--green); }
  .remember input:checked::after { content: '✓'; position: absolute; top: -3px; left: 2px; font-size: 12px; color: #fff; font-weight: 700; }
  .forgot { color: var(--blue); text-decoration: none; font-weight: 700; border-bottom: 1.5px solid rgba(30,111,217,0.35); padding-bottom: 1px; transition: all 0.2s; cursor: pointer;}
  .forgot:hover { border-color: var(--blue); }

  .btn-group { display: flex; gap: 12px; }
  .btn {
    flex: 1; padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #3FAE7A 0%, #2E8B57 40%, #1E6FD9 100%);
    color: #ffffff; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(46,139,87,0.35), 0 0 0 2px #D4AF37 inset;
    position: relative; overflow: hidden;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(30,111,217,0.45), 0 0 0 2px #F5E6A8 inset; }
  .btn:active { transform: translateY(0) scale(0.98); }
  
  .btn.secondary { background: transparent; color: var(--ink); border: 2px solid var(--gold-deep); box-shadow: none; }
  .btn.secondary:hover { background: rgba(255,255,255,0.4); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

  .error { color: #d93025; font-weight: 600; font-size: 13px; text-align: center; margin-top: 15px; }

  .divider { display: flex; align-items: center; gap: 16px; margin: 28px 0; color: var(--ink-soft); font-size: 11px; letter-spacing: 1.5px; font-weight: 600; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(42,31,10,0.4), transparent); }
  .socials { display: flex; gap: 12px; }
  .social-btn { flex: 1; padding: 13px; background: rgba(255,255,255,0.6); border: 1.5px solid rgba(184,134,11,0.4); border-radius: 12px; color: var(--ink); cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; }
  .social-btn:hover { border-color: var(--blue); background: rgba(255,255,255,0.9); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(30,111,217,0.15); }
  .social-btn svg { width: 22px; height: 22px; }

  /* ===== CHAT SCREEN (Hidden by default) ===== */
  .chat-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--gold-pale);
    display: flex; flex-direction: column; z-index: 10;
  }
  .chat-header {
    padding: 20px;
    background: linear-gradient(135deg, #FBF3D5 0%, #F5E6A8 100%);
    border-bottom: 2px solid var(--gold-deep);
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-header h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--ink); }
  .chat-header button { background: transparent; border: 2px solid var(--gold-deep); padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; color: var(--ink); transition: 0.2s; }
  .chat-header button:hover { background: var(--gold-deep); color: #fff; }
  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #fffaf0; }
  .message { padding: 12px 18px; border-radius: 16px; max-width: 80%; font-size: 15px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .message.assistant { background: #ffffff; border: 1px solid var(--gold-light); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
  .message.user { background: linear-gradient(135deg, #3FAE7A 0%, #1E6FD9 100%); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .chat-footer { padding: 20px; background: #ffffff; border-top: 2px solid var(--gold-light); display: flex; gap: 12px; }
  .chat-footer input { flex: 1; padding: 14px 18px; border: 2px solid var(--gold-light); border-radius: 24px; font-size: 15px; outline: none; transition: 0.2s; background: #fffaf0; }
  .chat-footer input:focus { border-color: var(--blue); background: #fff; }
  .chat-footer button { padding: 0 24px; background: linear-gradient(135deg, #3FAE7A 0%, #1E6FD9 100%); color: white; border: none; border-radius: 24px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .chat-footer button:hover { transform: scale(1.05); }

  @media (max-width: 480px) {
    .card { padding: 36px 24px 32px; }
    .brand { font-size: 28px; }
  }
</style>
</head>
<body>

  <!-- AUTH CARD -->
  <div class="card" id="auth-container">
    <div class="logo-wrap">
      <div class="logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gbGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#1E6FD9"/><stop offset="55%" stop-color="#2E9BC2"/><stop offset="100%" stop-color="#2E8B57"/>
            </linearGradient>
            <linearGradient id="bubbleFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3FAE7A"/><stop offset="100%" stop-color="#1E6FD9"/>
            </linearGradient>
          </defs>
          <path d="M14 10h36a6 6 0 0 1 6 6v24a6 6 0 0 1-6 6H32l-8 8v-8h-10a6 6 0 0 1-6-6V16a6 6 0 0 1 6-6z" fill="url(#bubbleFill)" stroke="url(#gbGrad)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M24 22h18M24 30h13M24 38h9" stroke="#F5E6A8" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand">FelChat</div>
      <div class="tagline">Conversations, Refined</div>
    </div>

    <form id="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" />
          Remember me
        </label>
        <a href="#" class="forgot" onclick="alert('Coming in Phase 2!'); return false;">Forgot password?</a>
      </div>

      <div class="btn-group">
        <button type="button" id="btn-login" class="btn">Sign In</button>
        <button type="button" id="btn-register" class="btn secondary">Register</button>
      </div>
      <p id="auth-error" class="error"></p>

      <div class="divider">OR CONTINUE WITH</div>

      <div class="socials">
        <button type="button" class="social-btn" aria-label="Google" onclick="alert('Coming in Phase 2!');">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3-3C17.3 1.9 14.9 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.5 2.7C6.3 7.2 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/><path fill="#FBBC05" d="M5.4 14c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2L1.9 6.9C1.1 8.4.7 10.2.7 12s.4 3.6 1.2 5.1L5.4 14z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.7-2.9c-1 .7-2.3 1.1-3.6 1.1-3.1 0-5.7-2.2-6.6-5l-3.5 2.7C3.7 20.4 7.5 23 12 23z"/></svg>
        </button>
        <button type="button" class="social-btn" aria-label="Apple" onclick="alert('Coming in Phase 2!');">
          <svg viewBox="0 0 24 24" fill="#2A1F0A" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 12.54c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.1-2.01-3.77-2.04-1.6-.16-3.13.94-3.94.94-.81 0-2.07-.92-3.4-.89-1.75.03-3.36 1.02-4.26 2.58-1.82 3.15-.46 7.82 1.3 10.38.86 1.25 1.89 2.65 3.24 2.6 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.39.81 1.4-.02 2.29-1.27 3.15-2.53.99-1.45 1.4-2.86 1.42-2.93-.03-.01-2.72-1.04-2.75-4.13zM14.5 4.87c.71-.86 1.19-2.06 1.06-3.25-1.02.04-2.26.68-3 1.54-.66.76-1.24 1.98-1.09 3.15 1.14.09 2.31-.58 3.03-1.44z"/></svg>
        </button>
      </div>
    </form>
  </div>

  <!-- CHAT SCREEN -->
  <div class="chat-container hidden" id="chat-container">
    <div class="chat-header">
      <h2>FelChat</h2>
      <button id="btn-logout">Logout</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="message assistant">Welcome back! Phase 1 UI is locked in. Ready for the AI brain?</div>
    </div>
    <div class="chat-footer">
      <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
      <button id="btn-send">Send</button>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
